{# Una celda de sí/no para los consentimientos opcionales del socio. #}
<td class="text-center">
    {% if activo %}
    <i class="bi bi-check-lg text-success" aria-hidden="true"></i>
    <span class="visually-hidden">{{ etiqueta }}: sí</span>
    {% else %}
    <i class="bi bi-dash text-body-tertiary" aria-hidden="true"></i>
    <span class="visually-hidden">{{ etiqueta }}: no</span>
    {% endif %}
</td>
