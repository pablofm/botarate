{% load static %}
<nav class="navbar navbar-expand-lg border-bottom mb-3">
    <div class="container-fluid px-0">
        <a class="navbar-brand py-0" href="{% url 'dashboard' %}">
            <img class="d-block" src="{% static 'img/logo.jpg' %}" alt="Botarate" height="40">
        </a>
        {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-3">
            <span class="text-body-secondary">{{ user.email }}</span>
            {% if user.is_staff %}<a class="btn btn-sm btn-outline-secondary" href="{% url 'admin:index' %}">Admin</a>{% endif %}
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="btn btn-sm btn-outline-secondary" type="submit">Salir</button>
            </form>
        </div>
        {% endif %}
    </div>
</nav>
