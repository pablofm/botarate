{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{% url 'dashboard' %}">Inicio</a></li>
<li class="breadcrumb-item active" aria-current="page">Añadir alumna</li>
{% endblock breadcrumb %}

{% block content %}
<h1 class="h3 mb-4">Añadir alumna</h1>

<div class="row">
    <div class="col-12 col-md-6 col-xl-4">
        <form method="POST">
            {% csrf_token %}
            {% bootstrap_form form %}
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-link" href="{% url 'dashboard' %}">Cancelar</a>
        </form>
    </div>
</div>
{% endblock content %}
